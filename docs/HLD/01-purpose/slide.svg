<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#fff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold">One glanceable panel, three states</text>
  <g font-weight="bold" text-anchor="middle">
    <rect x="30" y="70" width="260" height="220" rx="10" fill="green"/>
    <text x="160" y="195" font-size="44" fill="#fff">GOOD</text>
    <rect x="320" y="70" width="260" height="220" rx="10" fill="gold"/>
    <text x="450" y="195" font-size="44" fill="#000">LAND IT</text>
    <rect x="610" y="70" width="260" height="220" rx="10" fill="red"/>
    <text x="740" y="195" font-size="44" fill="#fff">STOP</text>
  </g>
  <g text-anchor="middle" font-size="18">
    <text x="160" y="320">0 – 45 s</text>
    <text x="450" y="320">45 – 75 s</text>
    <text x="740" y="320">over 75 s</text>
  </g>
</svg>
